<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5e6c8">
<meta property="og:title" content="Is Trump Available? — 30 秒抓 Trump">
<meta property="og:description" content="点中真 Trump，别点到模仿秀演员。虚构政治讽刺小游戏。">
<meta name="description" content="30 秒抓 Trump 小游戏：点中真 Trump，别点到模仿秀演员。虚构政治讽刺。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤝%3C/text%3E%3C/svg%3E">
<title>Is Trump Available? — 特朗普今天有空吗？</title>
<style>
:root{
  --paper:#f5e6c8; --ink:#1a1a1a; --panel:#fffbe8;
  --accent:#d7263d; --accent2:#2e4057; --gold:#f4b400; --mint:#7fb069; --sky:#4ea8de;
  --shadow: 3px 3px 0 var(--ink);
  --bshadow: 5px 5px 0 var(--ink);
  --halftone: radial-gradient(circle at 1px 1px, rgba(0,0,0,.15) 1px, transparent 2px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Comic Sans MS","Marker Felt","Chalkduster",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;}
button{font:inherit;cursor:pointer;background:var(--panel);border:3px solid var(--ink);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
button:disabled{opacity:.4;cursor:not-allowed;}
button.primary{background:var(--accent);color:#fff;}
button.ghost{background:transparent;border-style:dashed;}
#app{display:grid;grid-template-rows:1fr;height:100dvh;position:relative;overflow:hidden;width:80%;margin:0 auto;border-inline:3px solid var(--ink);}
@media (max-width:600px){#app{width:100%;border-inline:0;}}
.screen{position:absolute;inset:0;display:none;background:var(--paper) var(--halftone);background-size:6px 6px;overflow:hidden;}
.screen.active{display:flex;flex-direction:column;}

/* MENU */
#menu{align-items:center;justify-content:center;justify-content:safe center;gap:12px;padding:20px;text-align:center;overflow-y:auto;}
#menu>*{flex-shrink:0;}
#lang{align-self:flex-end;margin-bottom:-6px;font:inherit;font-size:14px;padding:6px 8px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:10px;box-shadow:var(--shadow);}
/* tall desktop windows: the phone-sized menu looked lost, so scale the whole thing up */
@media (min-width:900px) and (min-height:1100px){#menu{zoom:1.25;}}
@media (min-width:900px) and (min-height:1350px){#menu{zoom:1.5;}}
#menu .logo{font-size:min(14vw,80px);line-height:1;color:var(--accent);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--gold);letter-spacing:-2px;transform:rotate(-2deg);margin-bottom:8px;}
#menu .logo span{display:inline-block;background:var(--gold);color:var(--ink);padding:0 10px;transform:rotate(3deg);border:3px solid var(--ink);box-shadow:var(--bshadow);}
#menu .slogan{font-size:16px;color:var(--accent2);background:#fff;border:2px dashed var(--ink);padding:6px 14px;border-radius:30px;}
#menu .avatars{display:flex;gap:20px;margin:10px 0;}
#menu .avatars svg{animation:bob 1.1s ease-in-out infinite alternate;transform-origin:50% 100%;}
#menu .avatars svg:last-of-type{animation-duration:1.5s;animation-direction:alternate-reverse;}
@keyframes bob{to{transform:translateY(-5px) rotate(-2deg);}}
@media (prefers-reduced-motion:reduce){#menu .avatars svg{animation:none;}}
#menu .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(380px,88vw);}
#menu .btns button{font-size:15px;padding:12px 6px;}
#menu .btns .primary{grid-column:1/-1;font-size:24px;padding:18px;animation:menu-pulse 1.2s infinite alternate;}
#menu .btns .primary small{display:block;font-size:13px;font-weight:400;opacity:.9;}
@keyframes menu-pulse{to{transform:scale(1.04);}}
@media (prefers-reduced-motion:reduce){#menu .btns .primary{animation:none;}}
#menu .diff{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
#menu .diff button{padding:8px 12px;font-size:14px;}
#menu .diff button.on{background:var(--accent);color:#fff;}
#menu .foot{font-size:11px;color:#666;max-width:80vw;margin-top:8px;}
.author-link{display:inline-block;margin-top:10px;padding:8px 14px;background:#1da1f2;color:#fff;border:3px solid var(--ink);border-radius:30px;text-decoration:none;font-size:13px;box-shadow:var(--shadow);font-weight:900;}
.social{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;flex-shrink:0;}
#menu>.social,#arcade>.social,#controls>.social{width:80%;margin:8px auto 0;justify-self:center;}
.social .author-link{margin:0;font-size:13px;padding:7px 12px;}
.social .soc{flex:none;width:38px;height:38px;padding:0;border-radius:50%;color:#fff;font-size:16px;line-height:1;}
.author-link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.share-btn{padding:10px 4px;border:3px solid var(--ink);border-radius:10px;box-shadow:var(--shadow);cursor:pointer;color:#fff;text-align:center;font-weight:900;font-family:inherit;}
.share-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.share-btn .si{font-size:22px;line-height:1;}
.share-btn .sn{font-size:10px;margin-top:3px;}

/* ARCADE */
#arcade{padding:10px;gap:10px;}
#arcade>*{width:100%;max-width:820px;align-self:center;}
#arc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:20px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);}
#arc-top b{color:var(--accent);font-size:28px;}
#arc-quote{font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
#arc-bar{position:relative;height:56px;flex-shrink:0;background:#fff;border:3px solid var(--ink);border-radius:12px;overflow:hidden;}
#arc-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);transition:width .15s;}
#arc-runner,#arc-goal{position:absolute;bottom:0;height:50px;width:40px;transition:left .15s;}
#arc-goal{right:4px;}
#arc-runner svg,#arc-goal svg{height:100%;width:100%;}
#arc-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;}
#arc-grid button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px;font-size:15px;overflow:hidden;touch-action:manipulation;}
#arc-grid button .who{position:absolute;inset:0 0 22px 0;display:flex;align-items:center;justify-content:center;font-size:min(14vw,72px);pointer-events:none;}
#arc-grid button .who svg{height:90%;width:auto;}
#arc-grid button .who>*{animation:arc-pop .16s ease-out;}
#arc-grid button .lbl{position:relative;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:1px 10px;}
#arc-grid button .bg{position:absolute;inset:0 0 22px 0;display:flex;align-items:center;justify-content:center;font-size:min(12vw,64px);opacity:.3;pointer-events:none;}
#arc-grid kbd{display:none;position:absolute;top:6px;left:8px;font:inherit;font-size:13px;opacity:.55;border:2px solid var(--ink);border-radius:6px;padding:0 6px;background:var(--panel);}
@media (hover:hover) and (pointer:fine){#arc-grid kbd{display:block;}} /* key hints only where there is a keyboard */
#arc-grid .who.gold svg{filter:drop-shadow(0 0 5px #ffd54a) drop-shadow(0 0 14px #ffb300);}
#arc-grid .who.gold::after{content:"✨";position:absolute;top:6%;right:12%;font-size:.45em;}
#arc-grid.fever button{border-color:var(--accent);box-shadow:0 0 0 3px var(--gold),var(--shadow);}
#arc-grid button.hit{animation:arc-hit .25s;}
#arc-grid button.bad{animation:arc-bad .3s;}
#arc-grid button.miss{animation:arc-miss .2s;}
.arc-float{position:absolute;left:50%;top:30%;font-size:30px;pointer-events:none;animation:arc-float .6s ease-out forwards;text-shadow:2px 2px 0 #fff;}
.arc-float.hit{color:#2d7a1f;} .arc-float.bad{color:var(--accent);}
#arc-combo{color:var(--accent);font-size:22px;}
.arc-who{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:10px;text-align:center;font-size:14px;}
.arc-who svg{width:60px;height:auto;}
.arc-who span:first-child svg{width:84px;}
.arc-win{display:flex;justify-content:center;gap:10px;margin-bottom:8px;}
.arc-win svg{width:64px;height:auto;}
#arc-top.low b{display:inline-block;animation:arc-low .5s infinite alternate;}
@keyframes arc-pop{from{transform:translateY(50%) scale(.5);opacity:0;}}
@keyframes arc-hit{0%{background:var(--mint);transform:scale(.94);}100%{transform:none;}}
@keyframes arc-bad{0%{background:var(--accent);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-4px);}}
@keyframes arc-miss{50%{transform:translateX(4px);background:#eee;}}
@keyframes arc-float{from{transform:translate(-50%,0);opacity:1;}to{transform:translate(-50%,-60px);opacity:0;}}
@keyframes arc-low{to{transform:scale(1.35);}}
@media (prefers-reduced-motion:reduce){#arcade *{animation:none!important;}}

/* GAME */
#game{display:none;flex-direction:column;}
#game.active{display:flex;}
#hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px;background:var(--panel);border-bottom:3px solid var(--ink);font-size:15px;position:relative;z-index:5;}
#hud .stat{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;min-height:40px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;}
#hud .stat b{color:var(--accent);font-size:17px;}
#hud .stat.v{flex-direction:column;justify-content:center;gap:2px;padding:8px 4px;min-height:64px;font-size:14px;}
#hud .stat.v b{font-size:24px;line-height:1;}
#hud .stat.v b small{font-size:13px;color:#777;}
#hud .stat .bar{flex:1;height:10px;background:#eee;border:1px solid var(--ink);border-radius:3px;overflow:hidden;position:relative;}
#hud .stat .bar::after{content:"";display:block;height:100%;width:var(--w,100%);background:var(--c,var(--mint));transition:width .3s;}
#stage{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#scene-view{flex:1;position:relative;overflow:hidden;background:#fffbe8;}
#scene-bg{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
#scene-bg svg{width:100%;height:100%;}
#scene-title{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--paper);padding:3px 10px;font-size:13px;border-radius:4px;transform:rotate(-1deg);z-index:2;}
#scene-objects{position:absolute;inset:0;pointer-events:none;}
#scene-objects .obj{position:absolute;pointer-events:auto;background:#fff;border:3px solid var(--ink);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s;}
#scene-objects .obj:active{transform:scale(.9);}
#scene-objects .obj::after{content:attr(data-label);position:absolute;top:100%;left:50%;transform:translate(-50%,2px);background:var(--ink);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;}
#char-takaichi{position:absolute;bottom:4px;left:12%;width:110px;height:140px;z-index:3;transition:transform .3s;pointer-events:none;}
#char-trump{position:absolute;bottom:4px;right:12%;width:120px;height:150px;z-index:3;opacity:0;transition:opacity .4s, transform .4s;pointer-events:none;}
#char-trump.visible{opacity:1;}
.speech{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;max-width:200px;font-size:12px;box-shadow:var(--shadow);line-height:1.3;z-index:4;}
.speech.left{top:10%;left:12%;}
.speech.left::after{content:"";position:absolute;bottom:-14px;left:30px;border:8px solid transparent;border-top-color:var(--ink);border-right-width:0;}
.speech.right{top:10%;right:12%;}
.speech.right::after{content:"";position:absolute;bottom:-14px;right:30px;border:8px solid transparent;border-top-color:var(--ink);border-left-width:0;}
#log{height:72px;overflow-y:auto;background:var(--panel);border-top:3px solid var(--ink);padding:6px 10px;font-size:15px;line-height:1.4;}
#log .line{border-bottom:1px dashed rgba(0,0,0,.2);padding:3px 0;}
#log .line.chaos{color:var(--accent);}
#log .line.win{color:var(--mint);}
#log .line.news{background:#fff;padding:4px 6px;margin:2px 0;border:1px solid var(--ink);border-radius:4px;font-style:italic;}
#controls{background:var(--panel);border-top:3px solid var(--ink);padding:8px;display:grid;grid-template-rows:auto auto;gap:6px;max-height:46dvh;}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));grid-auto-rows:max-content;gap:8px;max-height:36dvh;overflow-y:auto;padding:10px 4px 4px 0;}
#actions button{padding:12px;min-height:72px;font-size:17px;text-align:left;line-height:1.25;}
#actions button .cost{display:block;font-size:14px;opacity:.7;font-weight:400;margin-top:2px;}
#actions button.nav{order:-1;font-size:18px;}
#actions button.rec{animation:pulse 1.2s infinite;position:relative;}
#actions button.rec::before{content:var(--t-rec,"👉 推荐");position:absolute;top:-10px;right:8px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:12px;}
#inventory{display:flex;gap:6px;overflow-x:auto;padding:2px 0;min-height:54px;align-items:center;}
#inventory .slot{flex:0 0 48px;height:48px;background:#fff;border:2px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;cursor:pointer;}
#inventory .slot.empty{opacity:.3;}
#inventory .slot::after{content:attr(data-count);position:absolute;bottom:-4px;right:-4px;background:var(--accent);color:#fff;font-size:9px;padding:0 4px;border-radius:8px;border:1px solid var(--ink);display:none;}
#inventory .slot[data-count]:not([data-count="1"])::after{display:block;}
#inventory .label{font-size:13px;padding:0 4px;color:#666;}
#combine-btn{flex:0 0 auto;padding:12px 14px;font-size:14px;background:var(--mint);color:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;font-weight:900;margin-left:4px;}
#combine-btn:disabled{opacity:.4;cursor:not-allowed;}
.combo-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;margin:3px;border:3px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;}
.combo-chip.selected{background:var(--accent);color:#fff;}
.combo-chip:disabled{opacity:.4;cursor:not-allowed;}
.combo-preview{margin-top:10px;padding:8px;background:var(--panel);border:2px dashed var(--ink);border-radius:8px;font-size:12px;text-align:center;}
.combo-preview.ok{background:var(--mint);color:#fff;}
.combo-preview.fail{color:#999;}

/* MODAL */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
#modal.show{display:flex;}
#modal.show .card{animation:modal-pop .18s ease-out;}
@keyframes modal-pop{from{transform:scale(.85);opacity:0;}}
@media (prefers-reduced-motion:reduce){#modal.show .card{animation:none;}}
#modal .card{background:var(--paper);border:4px solid var(--ink);border-radius:16px;max-width:400px;width:100%;padding:16px;box-shadow:var(--bshadow);max-height:85dvh;overflow-y:auto;}
#modal h3{color:var(--accent);font-size:20px;margin-bottom:6px;text-shadow:2px 2px 0 var(--ink);}
#modal .sub{font-size:12px;color:#555;margin-bottom:10px;font-style:italic;}
#modal p{margin:8px 0;line-height:1.5;font-size:16px;}
#modal .choices{display:grid;gap:8px;margin-top:12px;}
#modal .choices button{text-align:left;padding:14px;min-height:60px;font-size:17px;}
#modal .choices button .consq{display:block;font-size:14px;opacity:.6;font-weight:400;margin-top:2px;}
#modal .evt-panel{background:#fff;border:3px dashed var(--accent);padding:10px;border-radius:12px;margin:8px 0;position:relative;}
#modal .evt-panel::before{content:var(--t-evt,"⚠️ 突发事件");position:absolute;top:-10px;left:10px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;}
#modal .boss-panel{background:#fff;border:3px solid var(--accent);padding:10px;border-radius:12px;margin:8px 0;position:relative;}
#modal .boss-panel::before{content:"⚠️ BOSS";position:absolute;top:-10px;left:10px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:900;letter-spacing:1px;}

/* RESULT */
#result{align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
#result.active{display:flex;flex-direction:column;}
.newspaper{background:#fffdf4;border:4px solid var(--ink);padding:16px;max-width:440px;width:100%;box-shadow:var(--bshadow);background-image:var(--halftone);background-size:4px 4px;}
.newspaper h1{font-size:28px;text-align:center;border-bottom:3px double var(--ink);padding-bottom:6px;letter-spacing:-1px;}
.newspaper .mast{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid var(--ink);margin-bottom:6px;}
.newspaper .headline{font-size:20px;text-align:center;margin:10px 0;color:var(--accent);line-height:1.2;}
.newspaper .stars{text-align:center;font-size:30px;letter-spacing:-4px;margin:8px 0;color:var(--gold);text-shadow:1px 1px 0 var(--ink);}
.newspaper .stars .off{color:#ccc;}
.newspaper .body{columns:1;font-size:13px;line-height:1.5;margin:8px 0;padding:8px;background:#fff;border:1px dashed var(--ink);}
.newspaper .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;margin:8px 0;}
.newspaper .stats-grid div{background:#fff;border:1px solid var(--ink);padding:3px 6px;}
.newspaper .achieves{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;}
.newspaper .achieves .badge{background:var(--gold);border:2px solid var(--ink);padding:2px 6px;font-size:11px;border-radius:12px;}
.newspaper .disclaimer{font-size:9px;color:#888;text-align:center;margin-top:8px;font-style:italic;border-top:1px dashed #ccc;padding-top:4px;}
#result .result-btns{display:flex;gap:8px;margin-top:12px;}

/* comic FX */
.fx{position:absolute;pointer-events:none;z-index:20;font-weight:900;font-size:40px;color:var(--accent);text-shadow:3px 3px 0 var(--ink);animation:fx .9s forwards;transform:translate(-50%,-50%);}
@keyframes fx{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0;}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(5deg);}100%{opacity:0;transform:translate(-50%,-150%) scale(.9) rotate(-10deg);}}

/* achievement toast */
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--gold);border:3px solid var(--ink);padding:8px 14px;border-radius:14px;z-index:50;animation:toast 3s forwards;box-shadow:var(--bshadow);text-align:center;font-size:12px;max-width:80vw;}
.toast b{display:block;color:var(--accent);font-size:14px;}
@keyframes toast{0%{transform:translate(-50%,-80px);opacity:0;}15%{transform:translate(-50%,0);opacity:1;}85%{transform:translate(-50%,0);opacity:1;}100%{transform:translate(-50%,-80px);opacity:0;}}

/* character animations */
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
@keyframes handshake{0%,100%{transform:translateX(0);}50%{transform:translateX(30px);}}

/* minigame overlay */
#minigame{position:absolute;inset:0;background:var(--paper);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
#minigame.show{display:flex;}
#minigame .mg-title{font-size:24px;color:var(--accent);margin-bottom:8px;}
#minigame .mg-desc{font-size:12px;color:#555;margin-bottom:12px;text-align:center;max-width:300px;}
#minigame .mg-scene{position:relative;width:min(340px,90vw);height:140px;background:linear-gradient(to bottom,#7fb069 60%,#5a8c4d 60%,#5a8c4d 100%);border:3px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:12px;}
#minigame .ball{position:absolute;bottom:20px;left:20px;width:16px;height:16px;background:#fff;border:2px solid var(--ink);border-radius:50%;transition:all .8s cubic-bezier(.2,.9,.4,1);}
#minigame .hole{position:absolute;bottom:20px;right:30px;width:18px;height:18px;background:var(--ink);border-radius:50%;}
#minigame .flag{position:absolute;bottom:38px;right:28px;width:2px;height:24px;background:var(--ink);}
#minigame .flag::after{content:"";position:absolute;top:0;left:2px;width:12px;height:8px;background:var(--accent);}
#minigame .powerbar{width:min(300px,80vw);height:24px;background:#fff;border:3px solid var(--ink);border-radius:12px;overflow:hidden;position:relative;margin-bottom:8px;}
#minigame .powerbar .fill{height:100%;width:0;background:linear-gradient(to right,var(--mint),var(--gold),var(--accent));transition:width .05s linear;}
#minigame .powerbar .target{position:absolute;top:-2px;height:28px;width:3px;background:var(--ink);}
#minigame .mg-info{font-size:14px;margin:8px 0;}
#minigame .mg-info b{color:var(--accent);}
#minigame button{margin:4px;}

/* news flash */

/* Quest strip */
#quest-strip{background:linear-gradient(to right,var(--gold) 70%,#fff);border-bottom:3px solid var(--ink);padding:8px 10px;font-size:13px;position:relative;z-index:4;display:flex;align-items:center;gap:6px;cursor:pointer;}
#quest-strip .q-label{color:var(--accent);font-weight:900;flex:0 0 auto;}
#quest-strip .q-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#quest-strip .q-prog{font-weight:900;color:var(--accent);flex:0 0 auto;}
#quest-strip.none{background:#eee;color:#888;}

/* Trump mood strip */
#trump-mood{background:#fff5d1;border-bottom:3px solid var(--ink);padding:8px 10px;font-size:15px;display:flex;align-items:center;gap:6px;position:relative;z-index:4;}
#trump-mood .label{color:var(--accent);font-weight:900;}
#trump-mood .mood-icon{font-size:16px;}
#trump-mood .mood-text{flex:1;}
#trump-mood .mood-hint{font-size:10px;color:#777;}

/* Boss banner */
#boss-banner{background:var(--accent);color:#fff;border-bottom:3px solid var(--ink);padding:4px 8px;font-size:11px;position:relative;z-index:4;display:none;}
#boss-banner.show{display:flex;align-items:center;gap:6px;animation:pulse-bg 1.5s infinite;}
#boss-banner .b-icon{font-size:16px;}
@keyframes pulse-bg{0%,100%{background:var(--accent);}50%{background:#c01e32;}}

/* Fake tweet card */
#tweet-card{position:absolute;bottom:60px;right:8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;max-width:240px;z-index:25;box-shadow:var(--bshadow);display:none;}
#tweet-card.show{display:block;animation:tweet-in 4.5s forwards;}
#tweet-card .t-head{display:flex;gap:6px;align-items:center;margin-bottom:3px;}
#tweet-card .t-av{width:22px;height:22px;background:var(--sky);border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
#tweet-card .t-author{color:var(--sky);font-size:11px;font-weight:900;flex:1;}
#tweet-card .t-text{font-size:12px;line-height:1.3;margin:3px 0;}
#tweet-card .t-meta{font-size:10px;color:#666;}
@keyframes tweet-in{0%{transform:translateX(120%);opacity:0;}8%{transform:translateX(0);opacity:1;}88%{transform:translateX(0);opacity:1;}100%{transform:translateX(120%);opacity:0;}}

/* Scenario card */

/* Confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
#confetti .cf{position:absolute;top:-30px;width:10px;height:14px;animation:cf-fall linear forwards;display:flex;align-items:center;justify-content:center;font-weight:900;}
@keyframes cf-fall{0%{transform:translate(0,-30px) rotate(0);opacity:1;}100%{transform:translate(var(--dx),110vh) rotate(1080deg);opacity:0;}}

/* World map modal */
.world-map{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0;}
.map-pin{position:relative;padding:16px 8px;font-size:16px;text-align:center;border:3px solid var(--ink);background:#fff;border-radius:10px;box-shadow:var(--shadow);cursor:pointer;min-height:56px;}
.map-pin:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.map-pin.locked{opacity:.35;cursor:not-allowed;}
.map-pin.you{background:var(--sky);color:#fff;}
.map-pin.trump{background:var(--accent);color:#fff;animation:pulse 1.2s infinite;}
.map-pin.you.trump{background:repeating-linear-gradient(45deg,var(--sky) 0 10px,var(--accent) 10px 20px);color:#fff;}
.map-pin.final-pin{background:var(--gold);grid-column:span 2;margin-top:6px;font-size:14px;animation:none;}
.map-pin .mp-marker{position:absolute;top:-10px;right:-6px;font-size:18px;filter:drop-shadow(1px 1px 0 var(--ink));}
.map-pin .mp-marker.right{right:auto;left:-6px;}
.map-pin .mp-crash{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:12px;background:var(--ink);color:var(--gold);padding:1px 6px;border-radius:4px;}
.map-pin .mp-rivals{position:absolute;bottom:-6px;right:-4px;font-size:14px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 4px;line-height:1.1;letter-spacing:-2px;}
@keyframes pulse{0%,100%{box-shadow:var(--shadow);}50%{box-shadow:0 0 0 4px var(--accent),var(--shadow);}}
.map-hint{font-size:11px;color:#555;text-align:center;margin-top:8px;padding:6px;background:var(--panel);border-radius:6px;}
.trump-crash-fx{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:60px;color:var(--accent);text-shadow:4px 4px 0 var(--ink);z-index:40;animation:crash .8s forwards;pointer-events:none;font-weight:900;}
@keyframes crash{0%{transform:translate(-50%,-50%) scale(.2) rotate(-30deg);opacity:0;}40%{transform:translate(-50%,-50%) scale(1.5) rotate(10deg);opacity:1;}100%{transform:translate(-50%,-100%) scale(.8) rotate(-15deg);opacity:0;}}

/* responsive */
@media (max-width:420px){
  #scene-objects .obj{width:52px;height:52px;font-size:26px;}
  #char-takaichi{width:88px;height:112px;}
  #char-trump{width:96px;height:120px;}
}
</style>
</head>

function initAllies(s){
  s.allies={};
  ALLIES.forEach(a=>{s.allies[a.id]=s.rng()<.6?"help":"sabo";});
}
function tickAllies(s){
  if(!s.allies)return;
  if(s.rng()>0.18) return;
  const a=pick(ALLIES,s.rng);
  const align=s.allies[a.id];
  const text=align==="help"?a.helpText:a.saboText;
  if(align==="help"){a.help(s);log("win",a.icon+" "+a.name+"："+text);}
  else{a.sabo(s);log("chaos",a.icon+" "+a.name+"："+text);}
}
function showAllyCard(){
  const build=()=>ALLIES.map(a=>{
    const align=state.allies[a.id];
    const c=align==="help"?"var(--mint)":"var(--accent)";
    const label=align==="help"?"🤝 帮":"😈 捣乱";
    const txt=align==="help"?a.helpText:a.saboText;
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px;margin:4px 0;border:3px solid var(--ink);border-radius:10px;background:#fff;">
      <div style="font-size:24px;flex:0 0 auto;">${a.icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:900;font-size:13px;">${a.name}</div>
        <div style="font-size:11px;color:#555;line-height:1.2;">${txt}</div>
      </div>
      <button data-ally="${a.id}" style="background:${c};color:#fff;font-size:11px;padding:6px 10px;flex:0 0 auto;">${label}</button>
    </div>`;
  }).join("");
  const render=()=>{
    const body='<p style="text-align:center;margin:0 0 8px;font-size:13px;">三位人物在你身边，每人可帮可捣乱。点击按钮切换。</p>'+build();
    showModal({title:"👥 身边的人",body,choices:[{label:"开始游戏 →",fn:closeModal}]});
    setTimeout(()=>{
      document.querySelectorAll('button[data-ally]').forEach(b=>{
        b.onclick=()=>{
          const id=b.dataset.ally;
          state.allies[id]=state.allies[id]==="help"?"sabo":"help";
          closeModal();render();
        };
      });
    },10);
  };
  render();
}

/* ---------- CONFETTI (win celebration) ---------- */
function launchConfetti(){
  let el=document.getElementById("confetti");
  if(!el){el=document.createElement("div");el.id="confetti";document.body.appendChild(el);}
  el.innerHTML="";
  const colors=["#d7263d","#f4b400","#7fb069","#4ea8de","#c7a7f5","#ff6b9d","#2e4057"];
  const shapes=["▲","●","★","■","♦"];
  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="cf";
    const shape=Math.random()<.3?shapes[Math.floor(Math.random()*shapes.length)]:"";
    if(shape){c.textContent=shape;c.style.fontSize=(12+Math.random()*14)+"px";c.style.color=colors[i%colors.length];}
    else{c.style.background=colors[i%colors.length];}
    c.style.left=(Math.random()*100)+"%";
    c.style.setProperty("--dx",(Math.random()*400-200)+"px");
    c.style.animationDelay=(Math.random()*.6)+"s";
    c.style.animationDuration=(2.5+Math.random()*2.5)+"s";
    el.appendChild(c);
  }
  setTimeout(()=>{if(el)el.innerHTML="";},6000);
}

function pickExcuses(s,n){
  n=n||3;
  const arr=[...EXCUSES];
  const out=[];
  for(let i=0;i<n&&arr.length;i++){
    const idx=Math.floor(s.rng()*arr.length);
    out.push(arr.splice(idx,1)[0]);
  }
  return out;
}

/* ---------- RIVAL LEADERS (all fictional) ---------- */
const RIVALS=[
  {id:"fr",name:"'法式'代表 Marconi",flag:"🥐"},
  {id:"de",name:"'德式'代表 Mertzel",flag:"🥨"},
  {id:"uk",name:"'英式'代表 Stramer",flag:"☕"}
];
function initRivals(s){
  s.rivals={};
  RIVALS.forEach(r=>{
    const pool=Object.keys(SCENES).filter(k=>k!=="kantei"&&k!=="final");
    s.rivals[r.id]={loc:pick(pool,s.rng),readiness:10+Math.floor(s.rng()*20),scoredCount:0};
  });
}
function tickRivals(s){
  if(!s.rivals) return;
  const trumpLoc=s.trumpLocation;
  Object.entries(s.rivals).forEach(([id,r])=>{
    const data=RIVALS.find(x=>x.id===id);
    const roll=s.rng();
    if(roll<0.45){
      r.loc=trumpLoc; // chase
    }else if(roll<0.75){
      const pool=Object.keys(SCENES).filter(k=>k!==r.loc&&k!=="final");
      r.loc=pick(pool,s.rng);
    }
    // encounter at trump location
    if(r.loc===trumpLoc){
      r.readiness+=4+Math.floor(s.rng()*6);
      r.scoredCount++;
      if(r.scoredCount===2||r.scoredCount===5||r.scoredCount===8){
        log("chaos",data.flag+" "+data.name+" 又在"+SCENES[trumpLoc].name+"抢到了 Trump 的注意力。");
        s.trumpWillingness=Math.max(0,s.trumpWillingness-6);
        s.flags.rivalStolen=(s.flags.rivalStolen||0)+1;
        if(s.flags.rivalStolen>=3) unlockAch(s,"stolen_x3");
      }
    }
    // also: if rival at SAME scene as player (not trump), small flavor
    if(r.loc===s.scene&&r.loc!==trumpLoc&&s.rng()<.1){
      log("",data.flag+" "+data.name+" 也在你附近晃悠。");
    }
  });
}
function countRivalsAt(s,sceneId){
  if(!s.rivals) return [];
  return Object.entries(s.rivals).filter(([id,r])=>r.loc===sceneId).map(([id])=>RIVALS.find(x=>x.id===id));
}

/* ---------- TRUMP WORLD-MAP WANDERING ---------- */
function generateNextLoc(s){
  // excludes kantei start-only + final + intel_bureau + current loc
  const exclude=new Set(["final","intel_bureau",s.trumpLocation]);
  if(s.trumpMood&&s.trumpMood.good&&SCENES[s.trumpMood.good]&&!exclude.has(s.trumpMood.good)&&s.rng()<0.5){
    return s.trumpMood.good;
  }
  if(s.rng()<0.6){
    const pool=Object.keys(SCENES).filter(k=>!exclude.has(k));
    return pick(pool,s.rng);
  }
  return s.trumpLocation; // stay
}

function tickTrump(s){
  if(!s.trumpLocation){
    const pool=Object.keys(SCENES).filter(k=>k!=="kantei"&&k!=="final"&&k!=="intel_bureau");
    s.trumpLocation=pick(pool,s.rng);
  }
  if(!s.trumpSchedule||s.trumpSchedule.length<3){
    s.trumpSchedule=[generateNextLoc(s),generateNextLoc(s),generateNextLoc(s)];
  }
  // 15% flash-quit (闪退) — reshuffles entire schedule
  if(s.rng()<0.15){
    const pool=Object.keys(SCENES).filter(k=>k!=="final"&&k!=="intel_bureau"&&k!==s.trumpLocation);
    const dest=pick(pool,s.rng);
    log("chaos","💨 Trump 闪退！他现在在："+SCENES[dest].name);

    showCrashFX();
    s.trumpLocation=dest;
    // rebuild schedule after crash
    s.trumpSchedule=[generateNextLoc(s),generateNextLoc(s),generateNextLoc(s)];
    s.flags.trumpCrashes=(s.flags.trumpCrashes||0)+1;
    if(s.flags.trumpCrashes>=5) unlockAch(s,"chaser");
    return;
  }
  // consume scheduled next location
  const next=s.trumpSchedule.shift();
  s.trumpSchedule.push(generateNextLoc(s));
  if(next!==s.trumpLocation){
    s.trumpLocation=next;
    log("","📍 Trump 移动到："+SCENES[next].name);
  }
}

function showCrashFX(){
  const sv=document.getElementById("scene-view");
  if(!sv)return;
  const fx=document.createElement("div");
  fx.className="trump-crash-fx";
  fx.textContent="💨闪退!";
  sv.appendChild(fx);
  setTimeout(()=>fx.remove(),800);
}

const HOBBIES=[
  {id:"golf",icon:"⛳",name:"打高尔夫"},
  {id:"coin",icon:"🪙",name:"买币"},
  {id:"cola",icon:"🥤",name:"喝可乐"},
  {id:"burger",icon:"🍔",name:"吃汉堡"},
  {id:"tweet",icon:"🐦",name:"发推文"},
  {id:"deal",icon:"💼",name:"谈生意"}
];
const HOBBY_MAX=3;
function hobbyTotal(s){return Object.values(s.hobbies||{}).reduce((a,b)=>a+b,0);}
function hobbyPullChance(s){return hobbyTotal(s)*0.01;}
function learnHobby(id){
  const s=state,h=HOBBIES.find(x=>x.id===id);
  s.hobbies=s.hobbies||{};
  if((s.hobbies[id]||0)>=HOBBY_MAX||s.stamina<10) return false;
  s.hobbies[id]=(s.hobbies[id]||0)+1;
  s.day-=1; s.stamina-=10;
  s.trumpWillingness=Math.min(100,s.trumpWillingness+3);
  log("win",h.icon+" 学会「"+h.name+"」Lv"+s.hobbies[id]+"，好感 +3，Trump 来找你的概率 "+Math.round(hobbyPullChance(s)*100)+"%");

  afterTurn();
  return true;
}
function hobbyPull(s){
  if(s.scene===s.trumpLocation||s.scene==="final"||s.rng()>=hobbyPullChance(s)) return;
  const own=HOBBIES.filter(h=>(s.hobbies||{})[h.id]>0);
  const h=own[Math.floor(s.rng()*own.length)];
  s.trumpLocation=s.scene;
  log("win",h.icon+" Trump 听说你也爱"+h.name+"，专程跑来找你！");
}
function openHobbyPanel(){
  const hb=state.hobbies||{};
  showModal({
    title:"🎓 学 Trump 的爱好",
    body:"每学一级花 1 天、10 体力：好感 +3，Trump 每天主动来找你的概率 +1%。<br>当前概率：<b>"+Math.round(hobbyPullChance(state)*100)+"%</b>",
    choices:HOBBIES.map(h=>{
      const lv=hb[h.id]||0;
      return {label:h.icon+" "+h.name+" Lv"+lv+"/"+HOBBY_MAX,consq:lv>=HOBBY_MAX?"已学满":"1d ⚡-10",
        disabled:lv>=HOBBY_MAX||state.stamina<10,fn:()=>{closeModal();learnHobby(h.id);}};
    }).concat([{label:"关闭",fn:closeModal}])
  });
}
function gaffe(s,what){
  s.trumpWillingness=Math.max(0,s.trumpWillingness-5);
  s.flags.gaffes=(s.flags.gaffes||0)+1;
  log("chaos","😬 "+what+"！Trump 好感 -5");
  toast("😬 "+what,"Trump 好感 -5");
}
function checkEncounter(s){
  if(s.scene===s.trumpLocation&&s.flags.lastBumpScene!==s.scene){
    s.flags.lastBumpScene=s.scene;
    s.flags.bumpCount=(s.flags.bumpCount||0)+1;
    s.trumpWillingness=Math.min(100,s.trumpWillingness+10);
    s.readiness=Math.min(100,s.readiness+8);
    toast("⚡ 偶遇 Trump！","好感 +10 准备度 +8");

    showFX("BUMP!","50%","40%");
    log("win","⚡ 在"+SCENES[s.scene].name+"偶遇 Trump！");
    if(s.flags.bumpCount>=3) unlockAch(s,"bumper");
  }else if(s.scene!==s.trumpLocation){
    s.flags.lastBumpScene=null;
  }
}

function getBossStage(evt,s){
  const idx=s.boss.stageIdx;
  if(idx===0) return evt.stages[0];
  const base=evt.stages[idx];
  const prev=s.boss.chosen[idx-1];
  if(base.variants&&base.variants[prev]!==undefined) return base.variants[prev];
  return base;
}

function tickBosses(s){
  if(s.boss){
    // trigger stage modal when due and not already pending
    if(s.day<=s.boss.nextDeadline&&!s.boss.pendingStage){
      s.boss.pendingStage=true;
      openBossModal();
    }
    return;
  }
  const lastEnd=s.boss_lastEndDay==null?30:s.boss_lastEndDay;
  if((lastEnd-s.day)<5) return;
  if(s.rng()<0.10){
    const evt=pick(BOSS_EVENTS,s.rng);
    s.boss={id:evt.id,stageIdx:0,chosen:[],pendingStage:true,nextDeadline:s.day};

    log("chaos","⚠️ BOSS 爆发："+evt.icon+" "+evt.title);
    openBossModal();
  }
}

function openBossModal(){
  const evt=BOSS_EVENTS.find(b=>b.id===state.boss.id);
  if(!evt) return;
  const stage=getBossStage(evt,state);
  const choices=stage.choices.map((c,i)=>({
    label:c.label+(c.ideal?" ✨":""),
    fn:()=>{
      state.boss.chosen.push(i);
      c.fx(state);
      state.boss.pendingStage=false;
      state.boss.stageIdx++;
      closeModal();
      if(state.boss.stageIdx>=evt.duration){
        // settle
        const allIdeal=state.boss.chosen.every((ci,idx)=>{
          const st=idx===0?evt.stages[0]:(evt.stages[idx].variants&&evt.stages[idx].variants[state.boss.chosen[idx-1]])||evt.stages[idx];
          return st.choices[ci]&&st.choices[ci].ideal;
        });
        log("win","✅ Boss 结算："+evt.title+(allIdeal?"（全程 ideal！）":""));
        if(allIdeal) unlockAch(state,"boss_slayer");
        state.boss_lastEndDay=state.day;
        state.boss=null;
      }else{
        state.boss.nextDeadline=state.day-1; // next day's deadline
      }
      renderAll();saveGame();
    }
  }));
  const body='<div class="boss-panel"><h3 style="color:var(--accent);">'+evt.icon+' '+evt.title+'</h3><div class="sub">阶段 '+(state.boss.stageIdx+1)+'/'+evt.duration+'</div><p>'+stage.text+'</p></div>';
  showModal({title:"⚠️ BOSS 决断",body,choices});
}

  if(aId===bId) return {ok:false};
  const combo=COMBOS.find(c=>
    (c.parts[0]===aId&&c.parts[1]===bId)||(c.parts[0]===bId&&c.parts[1]===aId)
  );
  return combo?{ok:true,combo}:{ok:false};
}
function applyCombo(s,combo){
  s.items[combo.parts[0]]=Math.max(0,(s.items[combo.parts[0]]||0)-1);
  s.items[combo.parts[1]]=Math.max(0,(s.items[combo.parts[1]]||0)-1);
  if(!s.items[combo.parts[0]]) delete s.items[combo.parts[0]];
  if(!s.items[combo.parts[1]]) delete s.items[combo.parts[1]];
  combo.apply(s);
  s.flags.combosSeen=s.flags.combosSeen||[];
  if(!s.flags.combosSeen.includes(combo.id)) s.flags.combosSeen.push(combo.id);
  s.flags.alchemistCount=(s.flags.alchemistCount||0)+1;
  if(s.flags.alchemistCount>=5) unlockAch(s,"alchemist");
  log("win",combo.log);
  // global persistence for combo_master
  try{
    const g=new Set(JSON.parse(localStorage.getItem("ita_combos_found")||"[]"));
    g.add(combo.id);
    localStorage.setItem("ita_combos_found",JSON.stringify([...g]));
    if(g.size>=COMBOS.length) unlockAch(s,"combo_master");
  }catch(e){}
}

function getActiveVariant(sceneId){
  if(state.simple||!SCENE_VARIANTS[sceneId]) return null;
  if(!state.sceneVariants) state.sceneVariants={};
  if(state.sceneVariants[sceneId]===undefined){
    const roll=state.rng();
    if(roll<0.25) state.sceneVariants[sceneId]=null; // default
    else if(roll<0.75) state.sceneVariants[sceneId]=SCENE_VARIANTS[sceneId][0].id;
    else state.sceneVariants[sceneId]=SCENE_VARIANTS[sceneId][1].id;
    // track seen for achievement
    if(state.sceneVariants[sceneId]){
      state.flags.variantsSeen=state.flags.variantsSeen||[];
      const key=sceneId+":"+state.sceneVariants[sceneId];
      if(!state.flags.variantsSeen.includes(key)){
        state.flags.variantsSeen.push(key);
        const allVariants=Object.entries(SCENE_VARIANTS).reduce((a,[sid,arr])=>a+arr.length,0);
        if(state.flags.variantsSeen.length>=allVariants) unlockAch(state,"variant_master");
      }
    }
  }
  const id=state.sceneVariants[sceneId];
  if(!id) return null;
  return SCENE_VARIANTS[sceneId].find(v=>v.id===id);
}

  s.quest={id:t.id,templateId:t.id,text:t.text,deadline:s.day-t.days,created:s.day,data:{},reward:t.reward};
  if(t.init) t.init(s);

  log("","🎯 新悬赏："+t.text+"（奖励："+fmtReward(t.reward)+"）");

function fmtReward(r){
  const p=[];
  if(r.res)p.push("💴+"+r.res);
  if(r.readiness)p.push("📈+"+r.readiness);
  if(r.domestic)p.push("🇯🇵+"+r.domestic);
  if(r.item)p.push(ITEMS[r.item].icon+" "+ITEMS[r.item].name);
  if(r.stamina)p.push("⚡+"+r.stamina);
  return p.join(" ");
}
function checkQuest(s){
  if(!s.quest) return;
  const t=QUEST_TEMPLATES.find(x=>x.id===s.quest.templateId);
  if(!t) return;
  const res=t.check(s);
  s.quest.progress=res.progress;
  if(res.done){
    const r=s.quest.reward;
    if(r.res) s.res+=r.res;
    if(r.readiness) s.readiness=Math.min(100,s.readiness+r.readiness);
    if(r.domestic) s.domestic=Math.min(100,s.domestic+r.domestic);
    if(r.stamina) s.stamina=Math.min(100,s.stamina+r.stamina);
    if(r.item&&!s.items[r.item]) s.items[r.item]=1;
    const doneText="🎯 悬赏完成："+s.quest.text+" → "+fmtReward(r);
    s.flags.questsDone=(s.flags.questsDone||0)+1;
    if(s.flags.questsDone>=10) unlockAch(s,"questmaster");
    const fire=()=>{toast("🎯 悬赏完成",fmtReward(r));log("win",doneText);};
    if(document.getElementById("modal")&&document.getElementById("modal").classList.contains("show")){
      setTimeout(fire,300);
    } else fire();
    s.quest=null;
  } else if(s.day<=s.quest.deadline){
    log("chaos","🎯 悬赏过期："+s.quest.text);
    s.quest=null;
  }
}

/* ---------- CHAOS DIRECTOR ---------- */
class ChaosDirector{
  constructor(diff,rng){
    this.diff=diff;
    this.rng=rng;
    this.budget={easy:12,normal:20,hard:30,impossible:50}[diff];
    this.spent=0;
    this.recent=[];
    this.failStreak=0;
    this.resolveStreak=0;
    this.actionCount={};
  }
  afterAction(actionId,s){
    this.actionCount[actionId]=(this.actionCount[actionId]||0)+1;
    const repeatBonus=Math.min(0.25,(this.actionCount[actionId]-1)*0.08);
    const baseChance={easy:.25,normal:.42,hard:.58,impossible:.78}[this.diff];
    if(this.rng()>baseChance+repeatBonus) return null;
    let pool=CHAOS.filter(e=>
      e.sev+this.spent<=this.budget &&
      !this.recent.includes(e.id) &&
      (!e.scene||e.scene===s.scene) &&
      (!e.after||e.after===actionId) &&
      (!e.requires||e.requires(s))
    );
    if(!pool.length) return null;
    // fairness: if player struggling, pick lower severity
    if(this.failStreak>=3){
      pool.sort((a,b)=>a.sev-b.sev);
      return pool[0];
    }
    // weight: harder events rarer in easy, more common in impossible
    let evt=wpick(pool,e=>{
      const sevW={easy:[3,2,1],normal:[3,3,2],hard:[2,3,3],impossible:[1,3,4]}[this.diff];
      return sevW[e.sev-1]||1;
    },this.rng);
    // intel bureau's chaos shield: downgrade severity by 1 (min 1) and consume
    if(evt&&s.flags&&s.flags.chaosShield){
      evt={...evt,sev:Math.max(1,evt.sev-1)};
      delete s.flags.chaosShield;
      log("win","⚠️ 预警生效，本次混沌降级。");
    }
    // combo shields: skip event entirely if category matches and shield active
    if(evt&&s.flags){
      const SHIELDS={
        translatorShield:["translator_sick"],
        newsShield:["news_scandal","tk_oldphoto","tk_tweet_resurface","menu_wrong","press_question"],
        commShield:["comm_blackout","video_update"],
        weatherShield:["flight_delay","golf_rain","heavy_rain_kantei","jr_weather"]
      };
      for(const key in SHIELDS){
        if(s.flags[key]&&SHIELDS[key].includes(evt.id)){
          log("win","🛡️ "+key+" 生效，自动化解 "+evt.title);
          if(typeof s.flags[key]==="number"&&s.flags[key]>1) s.flags[key]--;
          else delete s.flags[key];
          return null; // skip event
        }
      }
    }
    return evt;
  }
  consume(evt,resolved){
    this.spent+=evt.sev;
    this.recent.push(evt.id);
    if(this.recent.length>3) this.recent.shift();
    if(resolved){this.resolveStreak++;this.failStreak=0;if(this.resolveStreak>=5)unlockAch(state,"systembreak");}
    else{this.failStreak++;this.resolveStreak=0;state.flags.anyFail=true;}
  }
}

const ARC_PLACES=["🏛️ 白宫 #dbe7f6","⛳ 高尔夫 #cfe8b9","🌴 海湖庄园 #ffe4b3","🛫 机场 #cfe6ef","🍔 汉堡店 #ffd6bd","🎤 集会 #f8c8c8","🌐 峰会 #d6daf7","🗼 东京 #f6d1e2","📺 电视台 #e4dcf3"];

const ARC_FAKES=[["#f4b400","#6b4a2b"],["#f4b400","#d9d9d9"],["#d7263d","#222222"],["#d7263d","#2f6fd6"]];
// what Trump (or the impersonator) says, by what just happened
const ARC_SAY={
  hit:["Tremendous!","Very nice!","高市？好名字！","Great deal!","我喜欢她的汉堡","Huge! 握个手！","Nobody chases better!","Beautiful 握手！","她很会找人，believe me","这是史上最好的握手"],

  fever:["🔥 握手狂热！停不下来！","🔥 On fire! 高市火力全开！","🔥 Unbelievable 连击！"]
};
const ARC_SPEED={easy:1300,normal:1050,hard:850,impossible:680}; // ms Trump stays in one place at 0 favor
const ARC_RAMP=0.3;       // he gets this much faster (fraction of stay time) as favor approaches the goal
const ARC_SECONDS=30,ARC_GOAL=100,ARC_HIT=8,ARC_COMBO_AT=3,ARC_COMBO_HIT=12,ARC_MISS=10,ARC_RIVAL_P=0.25,ARC_DUO_AT=50;
const ARC_FEVER_AT=5,ARC_FEVER_HIT=15;                 // "handshake fever": 5 in a row and every hit is worth more
const ARC_GOLD_P=0.12,ARC_GOLD_HIT=20,ARC_GOLD_STAY=0.6; // golden Trump: rare, leaves sooner, worth more
let arc=null;
function arcStop(){if(arc){clearTimeout(arc.hop);clearInterval(arc.clock);}}
// highest score per difficulty; pass v to record it if it beats the old one
function arcBest(diff,v){
  const k="ita_arc_hi_"+diff;
  try{const old=parseInt(localStorage.getItem(k))||0;
    if(v>old){localStorage.setItem(k,v);return v;}
    return old;
  }catch(e){return 0;}
}
function arcStay(diff,score){return (ARC_SPEED[diff]||ARC_SPEED.normal)*(1-ARC_RAMP*Math.min(1,score/ARC_GOAL));}
function arcGrade(score){return score>=800?"S · 外交天才":score>=500?"A · 金牌说客":score>=300?"B · 合格首相":"C · 压线握手";}
function arcGain(combo){return combo>=ARC_FEVER_AT?ARC_FEVER_HIT:combo>=ARC_COMBO_AT?ARC_COMBO_HIT:ARC_HIT;}
// first run only: show who to tap and who not to, then start
let arcSeenIntro=false;

function startArcade(diff){
  arcStop();
  showScreen("arcade");
  const grid=document.getElementById("arc-grid"),top=document.getElementById("arc-top");
  const trumpSvg=document.querySelector("#menu .avatars svg:last-of-type").outerHTML;
  document.getElementById("arc-runner").innerHTML=document.querySelector("#menu .avatars svg").outerHTML;
  document.getElementById("arc-goal").innerHTML=trumpSvg;
  grid.innerHTML=ARC_PLACES.map((n,i)=>{const [e,t,c]=n.split(" ");
    return '<button data-i="'+i+'" aria-label="'+t+'" style="background-color:'+c+'"><kbd>'+"QWEASDZXC"[i]+'</kbd><span class="bg">'+e+'</span><span class="who"></span><span class="lbl">'+t+'</span></button>';}).join("");
  arc={diff,score:0,combo:0,left:ARC_SECONDS,cell:-1,spots:{},hop:null,clock:null,over:false,won:false};
  const cells=[...grid.children];
  const paint=()=>{
    document.getElementById("arc-score").textContent=arc.score;
    const pct=Math.min(1,arc.score/ARC_GOAL);
    document.getElementById("arc-fill").style.width=pct*100+"%";
    document.getElementById("arc-runner").style.left="calc((100% - 88px) * "+pct+")"; // she walks the bar towards him
    document.getElementById("arc-time").textContent=arc.left;
    const fever=arc.combo>=ARC_FEVER_AT;
    document.getElementById("arc-combo").textContent=arc.combo>=2?"🔥×"+arc.combo+(fever?" 狂热":""):"";
    grid.classList.toggle("fever",fever);
    top.classList.toggle("low",arc.left<=5);
  };
  const say=t=>{document.getElementById("arc-quote").textContent=t;};
  const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
  const fx=(c,cls,txt)=>{ // flash a cell and float a "+8" style label out of it
    c.classList.remove("hit","bad","miss","gone"); void c.offsetWidth; c.classList.add(cls);
    if(txt){const f=document.createElement("span");f.className="arc-float "+cls;f.textContent=txt;
      c.appendChild(f);setTimeout(()=>f.remove(),600);}
  };
  const put=(i,who)=>{ // who: "trump" | "gold" | "rival" | null to clear the place
    const fake=pick(ARC_FAKES,Math.random), w=cells[i].querySelector(".who");
    w.innerHTML=!who?"":who==="rival"?trumpSvg.split(fake[0]).join(fake[1]):trumpSvg;
    w.classList.toggle("gold",who==="gold");
    if(who) arc.spots[i]=who; else delete arc.spots[i];
  };
  const hop=()=>{
    for(const i in arc.spots){
      if(arc.spots[i]!=="rival"){arc.combo=0;fx(cells[i],"gone","💨");say("💨 "+pick(ARC_SAY.gone,Math.random));} // he left before you tapped him
      put(i,null);
    }
    let n; do{n=Math.floor(Math.random()*9);}while(n===arc.cell);
    arc.cell=n;
    const real=Math.random()<ARC_GOLD_P?"gold":"trump";
    let who=real;
    if(arc.score>=ARC_DUO_AT){ // second half: the real one and an impersonator show up together
      put(n,real); put((n+1+Math.floor(Math.random()*8))%9,"rival");
    }else put(n,who=Math.random()<ARC_RIVAL_P?"rival":real);
    paint();
    arc.hop=setTimeout(hop,arcStay(diff,arc.score)*(who==="gold"?ARC_GOLD_STAY:1));
  };
  cells.forEach((c,i)=>c.onclick=()=>{
    if(arc.over) return;
    const who=arc.spots[i];
    if(!who){arc.combo=0;fx(c,"miss");paint();return;} // tapped an empty place
    put(i,null); // off the board, and hop() won't count him as escaped
    if(who!=="rival"){
      arc.combo++;
      const gold=who==="gold", g=gold?ARC_GOLD_HIT:arcGain(arc.combo);
      arc.score+=g; fx(c,"hit",(gold?"✨+":"🤝+")+g); buzz(gold?40:15);
      if(!arc.won&&arc.score>=ARC_GOAL){ // the handshake is in the bag; the rest of the 30 seconds is for the high score
        arc.won=true; launchConfetti(); say("🤝 握手达成！继续冲分！");
      }else say(gold?pick(ARC_SAY.gold,Math.random):arc.combo===ARC_FEVER_AT?pick(ARC_SAY.fever,Math.random):"🍊 "+pick(ARC_SAY.hit,Math.random));
    }else{
      arc.combo=0;
      arc.score=Math.max(0,arc.score-ARC_MISS); fx(c,"bad","-"+ARC_MISS); buzz(120);
      say("😬 "+pick(ARC_SAY.fake,Math.random)+"（好感 -"+ARC_MISS+"）");
    }
    clearTimeout(arc.hop);
    hop();
  });
  say("预备… 金发红领带才是真 Trump！");
  paint();
  arc.run=()=>{arc.clock=setInterval(()=>{arc.left--;paint();if(arc.left<=0)arcEnd();},1000);hop();};
  arc.hop=setTimeout(arc.run,800); // short breather so the first Trump isn't missed while reading
}

  state={
    diff, seed, rng,

  };
  state.chaos=new ChaosDirector(diff,rng);

  const eligible=TAKAICHI_MOODS.filter(m=>!m.when||m.when(s));

}
function rollTrumpMood(s){
  const prev=s.trumpMood;
  s.trumpMood=pick(TRUMP_MOODS,s.rng);
  // consume item if mood demands
  if(s.trumpMood.consume&&s.items[s.trumpMood.consume]>0){
    s.items[s.trumpMood.consume]--;
    s.trumpWillingness=Math.min(100,s.trumpWillingness+12);
    log("win","🍔 Trump 吃光了你的"+ITEMS[s.trumpMood.consume].name+"。好感 +12。");
  }
  // lucky day: in good scene when mood matches
  if(s.trumpMood.good&&s.trumpMood.good===s.scene){
    s.flags.goodDays=(s.flags.goodDays||0)+1;
    if(s.flags.goodDays>=3) unlockAch(s,"schedule_lucky");
  }
  // mood-driven tweet
  const tweetC=(s.trumpMood.tweet||0)*(s.flags.mediaStorm?2:1);

function saveGame(){
  if(!state)return;
  try{
    const copy={...state,
      scenesVisited:[...state.scenesVisited],
      achievements:[...state.achievements],
      rng:null,
      chaos:state.chaos?{
        spent:state.chaos.spent,
        recent:[...state.chaos.recent],
        failStreak:state.chaos.failStreak,
        resolveStreak:state.chaos.resolveStreak,
        actionCount:{...state.chaos.actionCount}
      }:null
    };
    localStorage.setItem("ita_save",JSON.stringify(copy));
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem("ita_save");
    if(!raw)return false;
    const d=JSON.parse(raw);
    state=d;
    state.scenesVisited=new Set(d.scenesVisited||[]);
    state.achievements=new Set(d.achievements||[]);
    state.rng=mulberry32(d.seed||123);
    const savedChaos=d.chaos;
    state.chaos=new ChaosDirector(d.diff,state.rng);
    if(savedChaos){
      state.chaos.spent=savedChaos.spent||0;
      state.chaos.recent=savedChaos.recent||[];
      state.chaos.failStreak=savedChaos.failStreak||0;
      state.chaos.resolveStreak=savedChaos.resolveStreak||0;
      state.chaos.actionCount=savedChaos.actionCount||{};
    }
    // heal old save: ensure trumpSchedule exists before any action
    if(!state.trumpSchedule||state.trumpSchedule.length<3) tickTrump(state);
    // re-open boss modal if saved mid-stage, so player isn't stuck
    if(state.boss&&state.boss.pendingStage){
      setTimeout(()=>{if(typeof openBossModal==="function") openBossModal();},100);
    }
    return true;
  }catch(e){return false;}
}

function fmtCost(c){
  if(!c)return "";
  const p=[];
  if(c.days)p.push(c.days+"d");
  if(c.res)p.push("💴"+c.res);
  if(c.stamina&&c.stamina>0)p.push("⚡-"+c.stamina);
  if(c.stamina&&c.stamina<0)p.push("⚡+"+(-c.stamina));
  return p.join(" ");
}
function formatReq(r){
  if(!r)return "";
  if(r.item)return " 需要"+ITEMS[r.item].icon;
  if(r.stat){const k=Object.keys(r.stat)[0];return " 需 "+k+">="+r.stat[k];}
  return "";
}
function canAfford(a,s){
  const c=a.cost||{};
  return (c.days||0)<=s.day && (c.res||0)<=s.res && (c.stamina||0)<=s.stamina;
}
function reqMet(r,s){
  if(!r)return true;
  if(r.item&&!(s.items[r.item]>0))return false;
  if(r.stat){for(const k in r.stat) if(s[k]<r.stat[k])return false;}
  return true;
}

function openCombinePanel(){
  let panelState={a:null,b:null};
  const build=()=>{
    const own=Object.entries(state.items).filter(([k,v])=>v>0);
    const chips=own.map(([k,v])=>{
      const sel=(panelState.a===k||panelState.b===k)?" selected":"";
      return `<button class="combo-chip${sel}" data-id="${k}">${ITEMS[k].icon} ${ITEMS[k].name} x${v}</button>`;
    }).join("");
    let preview="";
    if(panelState.a&&panelState.b){
      const r=tryCombine(panelState.a,panelState.b);
      if(r.ok) preview=`<div class="combo-preview ok">✓ 可合成：${r.combo.icon} ${r.combo.name}<br><button class="primary" id="combo-fire" style="margin-top:6px;">合成！</button></div>`;
      else preview='<div class="combo-preview fail">✗ 这两件无匹配配方</div>';
    }else preview='<div class="combo-preview fail">点选两件道具试试组合</div>';
    return '<p style="font-size:12px;margin-bottom:8px;">点选两件道具，可能组合出一次性道具大招。</p><div>'+chips+'</div>'+preview;
  };
  const render=()=>{
    showModal({title:"🧪 道具组合",body:build(),choices:[{label:"关闭",fn:closeModal}]});
    setTimeout(()=>{
      document.querySelectorAll('.combo-chip').forEach(b=>{
        b.onclick=()=>{
          const id=b.dataset.id;
          if(panelState.a===id){panelState.a=null;}
          else if(panelState.b===id){panelState.b=null;}
          else if(!panelState.a){panelState.a=id;}
          else if(!panelState.b){panelState.b=id;}
          else {panelState.b=id;}
          render();
        };
      });
      const fire=document.getElementById("combo-fire");
      if(fire) fire.onclick=()=>{
        const r=tryCombine(panelState.a,panelState.b);
        if(r.ok){applyCombo(state,r.combo);closeModal();afterTurn();}
      };
    },10);
  };
  render();
}

/* ---------- ACTION DISPATCH ---------- */
function doAction(id){
  const a=ACTIONS[id];
  if(!a){log("","(未定义行动: "+id+")");return;}
  // apply scene variant actionMods to effective cost
  const variant=getActiveVariant(state.scene);
  const mod=variant&&variant.actionMods&&variant.actionMods[id];
  let effCost={...(a.cost||{})};
  if(mod&&mod.costMul){for(const k in mod.costMul){effCost[k]=(effCost[k]||0)*mod.costMul[k];}}
  const effA={...a,cost:effCost};
  if(!canAfford(effA,state)){toast("❌ 资源不足",fmtCost(effCost));return;}
  if(a.require&&!reqMet(a.require,state)){toast("❌ 条件不足",formatReq(a.require));return;}

  // pay cost (effective)
  const c=effCost;
  state.day-=c.days||0;
  if(c.days) maybeResetVariants();
  state.res-=c.res||0;
  state.stamina=Math.max(0,Math.min(state.maxStamina,state.stamina-(c.stamina||0)));
  // execute
  const r=a.run(state)||{};
  if(r.text) log("",r.text);
  if(r.move){
    state.scene=r.move;
    state.scenesVisited.add(r.move);
    log("","📍 场景切换："+SCENES[r.move].name);
  }
  if(r.minigame==="golf"){ startGolfMinigame(); return; }
  if(r.minigame==="press"){ startPressMinigame(); return; }
  if(r.minigame==="negotiate"){ startNegotiateMinigame(); return; }
  if(r.minigame==="signal"){ startSignalMinigame(); return; }
  if(r.end){ endGame("final"); return; }
  // clamp stats
  state.stamina=Math.max(0,Math.min(100,state.stamina));
  state.domestic=Math.max(0,Math.min(100,state.domestic));
  state.readiness=Math.max(0,Math.min(100,state.readiness));
  state.trumpWillingness=Math.max(0,Math.min(100,state.trumpWillingness));
  // chaos director
  const evt=state.chaos.afterAction(id,state);
  if(evt) return triggerChaos(evt);
  afterTurn();
}
function afterTurn(){
  if(state.res<=0&&!state.flags.zeroHit){state.flags.zeroHit=true;unlockAch(state,"zero_res");}
  // scene variants reset per day
  if(state.sceneVariantsDay!==state.day){state.sceneVariants={};state.sceneVariantsDay=state.day;}
  rollTrumpMood(state);
  rollTakaichiMood(state);
  tickTrump(state);
  hobbyPull(state);
  tickRivals(state);
  tickAllies(state);
  if(!state.simple) tickBosses(state);
  checkEncounter(state);
  // daily quests: generate if none, check completion/expiry
  if(!state.simple){ if(!state.quest) rollQuest(state); checkQuest(state); }
  // random tweet trigger on milestones
  if(state.rng()<0.08*(state.flags.mediaStorm?2:1)) setTimeout(()=>showTweet(),300);
  renderAll(); saveGame();
  checkEndConditions();
}
function triggerChaos(evt){
  state.pendingChaos=evt;
  showFX("!!",null,null);

  if(state.rng()<0.3) setTimeout(()=>showTweet(),500);
  const choices=evt.resolve.map(r=>{
    const hasItem=r.item?state.items[r.item]>0:true;
    const affordCost=r.cost?canAfford({cost:r.cost},state):true;
    let label=r.label;
    if(r.item) label+=" "+ITEMS[r.item].icon;
    let consq="";
    if(r.cost) consq="代价："+fmtCost(r.cost);
    if(r.item&&!hasItem) consq="需要道具（未持有）";
    return {
      label,consq,
      disabled:(!hasItem)||(!affordCost),
      fn:()=>resolveChaos(evt,r)
    };
  });
  // always allow "fallback" to lose severity*5 readiness
  choices.push({
    label:"🫠 束手无策",
    consq:"损失"+(evt.sev*5)+"外交准备度、5 好感",
    fn:()=>resolveChaos(evt,{fx:s=>{s.readiness=Math.max(0,s.readiness-evt.sev*5);log("chaos","🫠 事件未解决。");gaffe(s,"做错事了");}},false)
  });
  showModal({
    event:true,
    title:"⚡ "+evt.title,
    sub:"难度 "+evt.sev,
    body:evt.text,
    choices
  });
}
function resolveChaos(evt,r,resolved){
  const c=r.cost||{};
  state.day-=c.days||0;
  state.res=Math.max(0,state.res-(c.res||0));
  state.stamina=Math.max(0,state.stamina-(c.stamina||0));
  if(r.item&&state.items[r.item]>0) state.items[r.item]--;
  if(r.fx) r.fx(state);
  const was=(resolved!==false);
  state.chaos.consume(evt,was);
  if(was){
    log("win","✅ 化解："+evt.title);
    if(evt.id.startsWith("tk_")){
      state.flags.tkResolved=(state.flags.tkResolved||0)+1;
      if(state.flags.tkResolved>=3) unlockAch(state,"ironpm");
      if(evt.id==="tk_burnout"&&state.flags.tkRested) unlockAch(state,"recovered_tk");
    }
    if(state.quest&&state.quest.data&&typeof state.quest.data.total==="number"){
      state.quest.data.total++;
    }
  }else{
    if(evt.id.startsWith("tk_")) state.flags.tkResolved=0;
  }
  closeModal();
  state.pendingChaos=null;
  afterTurn();
}

/* ---------- MINIGAME: JET SIGNAL CALIBRATION ---------- */
function startSignalMinigame(){
  const mg=document.getElementById("minigame");
  const R=90, CX=100, CY=100;
  let shots=0, hits=0;
  const rot={angle:0, speed:(state.stamina<30?120:180)}; // deg/s
  let last=performance.now(), raf=null, green={start:0,width:60};
  function freshTarget(){
    green.start=Math.floor(state.rng()*360);
    green.width=30+Math.floor(state.rng()*30);
  }
  function arcPath(cx,cy,r,startDeg,widthDeg){
    const a0=(startDeg-90)*Math.PI/180, a1=((startDeg+widthDeg)-90)*Math.PI/180;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=widthDeg>180?1:0;
    return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large},1 ${x1},${y1} Z`;
  }
  // build once, update only pointer transform + counters
  mg.innerHTML=`<div class="mg-title">📡 信号校准</div>
    <div class="mg-desc">点"校准"把指针停在绿色扇区。3 次机会。</div>
    <div style="font-size:12px;margin:6px 0;">命中：<b id="sg-score">0/0</b></div>
    <svg viewBox="0 0 200 200" width="200" height="200" style="background:#1a1a2e;border:3px solid var(--ink);border-radius:50%;">
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="#0a0a1e" stroke="#4ea8de" stroke-width="2"/>
      <path id="sg-arc" d="" fill="#7fb069" opacity=".65"/>
      <g id="sg-ptr" transform="rotate(0 ${CX} ${CY})">
        <line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-R}" stroke="#d7263d" stroke-width="4"/>
      </g>
      <circle cx="${CX}" cy="${CY}" r="6" fill="#f4b400" stroke="#1a1a1a" stroke-width="2"/>
    </svg>
    <div style="margin-top:12px;display:flex;gap:6px;">
      <button class="primary" id="sg-hit">校准</button>
      <button class="ghost" id="sg-quit">结束</button>
    </div>`;
  const arcEl=mg.querySelector("#sg-arc");
  const ptrEl=mg.querySelector("#sg-ptr");
  const scoreEl=mg.querySelector("#sg-score");
  function updateArc(){arcEl.setAttribute("d",arcPath(CX,CY,R,green.start,green.width));}
  function tick(now){
    const dt=(now-last)/1000; last=now;
    rot.angle=(rot.angle+rot.speed*dt)%360;
    ptrEl.setAttribute("transform",`rotate(${rot.angle} ${CX} ${CY})`);
    raf=requestAnimationFrame(tick);
  }
  mg.querySelector("#sg-hit").onclick=()=>{

    const cur=((rot.angle%360)+360)%360;
    const diff=((cur-green.start)%360+360)%360;
    if(diff<=green.width){hits++;}

    shots++;
    scoreEl.textContent=hits+"/"+shots;
    if(shots>=3){mg.querySelector("#sg-hit").disabled=true;cancelAnimationFrame(raf);return finish();}
    freshTarget(); updateArc();
  };
  mg.querySelector("#sg-quit").onclick=()=>{cancelAnimationFrame(raf);finish(true);};
  function finish(quit){
    mg.classList.remove("show");
    cancelAnimationFrame(raf);
    if(quit){log("","信号校准放弃。");afterTurn();return;}
    const perfect=(hits===3);
    const rdGain=hits*10, wiGain=hits*5+(perfect?10:0);
    state.readiness=Math.min(100,state.readiness+rdGain);
    state.trumpWillingness=Math.min(100,state.trumpWillingness+wiGain);
    log("win","📡 信号校准 "+hits+"/3 命中 → 📈+"+rdGain+" 🤝+"+wiGain+(perfect?" (全命 bonus)":""));
    const evt=state.chaos.afterAction("jet_satphone",state);
    if(evt) triggerChaos(evt); else afterTurn();
  }
  freshTarget(); updateArc();
  mg.classList.add("show");
  raf=requestAnimationFrame(tick);
}

function computeStars(s){
  // 0 Zero — timeup, not met
  // 1 One — share event (summit)
  // 2 Two — greeting (photo taken OR summit visit with trumpW>=40)
  // 3 Three — handshake (readiness>=40, summit or golf)
  // 4 Four — selo photo (trumpW>=60, photo)
  // 5 Five — formal bilateral (final meeting with readiness>=80)
  // 6 Six — bilateral + econdoc + pact
  // 7 Seven — all plus next-invite condition (trumpW>=85, readiness>=90, pact)
  if(!s.flags.metFinal){
    if(s.flags.photoTaken&&s.trumpWillingness>=40) return 2;
    if(s.scenesVisited.has("summit")) return 1;
    return 0;
  }
  let stars=3;
  if(s.flags.photoTaken) stars=4;
  if(s.readiness>=80) stars=5;
  if(s.readiness>=80&&s.items.econdoc>0) stars=6;
  if(s.readiness>=90&&s.trumpWillingness>=85&&s.items.pact>0) stars=7;
  return stars;
}
function endGame(reason){
  // may award pact if close
  if(state.flags.metFinal){
    if(state.readiness>=70&&state.items.econdoc>0&&!state.items.pact){
      state.items.pact=1;
      log("win","📜 自动产生合作协议草案。");
    }
    unlockAch(state,"firstmeet");
    if(state.readiness>=80) unlockAch(state,"icebreak");
    if(!state.flags.anyFail&&state.readiness>=80) unlockAch(state,"perfect");
    if(state.day<=1) unlockAch(state,"miracle");
    if(state.resStart-state.res<=50) unlockAch(state,"pennydiplo");
    if(state.diff==="impossible") unlockAch(state,"hardest");
    if(computeStars(state)>=7) unlockAch(state,"fictionpact");
    if(state.flags.alternativeMet) unlockAch(state,"hometurf");
    if(state.scenario) markScenarioDone(state.scenario.id);
    if(state.rivals){
      const maxRival=Math.max(...Object.values(state.rivals).map(r=>r.readiness));
      if(state.readiness>maxRival) unlockAch(state,"top_diplomat");
      if(Object.values(state.rivals).some(r=>r.scoredCount===0)) unlockAch(state,"beat_rival");
    }
  }else if(state.scenesVisited.size>=10){
    unlockAch(state,"true_bystander");
  }
  state.end={reason,stars:computeStars(state)};

  if(state.flags.metFinal){
    state.end.excuses=null;
    setTimeout(launchConfetti,200);
    setTimeout(launchConfetti,1800);
  }else{
    state.end.excuses=pickExcuses(state,3);
  }
  renderResult();
  clearSave();
}

      <div class="achieves">${achList||'<span class="badge">暂无成就</span>'}</div>
      <div class="disclaimer">本游戏中的所有人物、事件、新闻与行程均为虚构政治讽刺内容，不涉及现实人物的实际行程与安保信息。</div>
    </div>
    <div class="result-btns">
      <button class="primary" onclick="shareResult()">📤 分享</button>
      <button onclick="location.reload()">🏠 回主菜单</button>
      <button onclick="startNewGame('${state.diff}')">🔁 再来一次</button>
    </div>
    <a href="https://x.com/MatthewUpbeat" target="_blank" rel="noopener" class="author-link" style="margin-top:14px;">🐦 喜欢这个游戏？关注作者 @MatthewUpbeat</a>
  `;
}
const AUTHOR_URL="https://x.com/MatthewUpbeat";
const GAME_URL=AUTHOR_URL; // TODO: replace with hosted game URL

function sharePlatforms(text,url){
  const e=encodeURIComponent;
  return [
    {id:"x",name:"X",icon:"𝕏",color:"#000",u:`https://twitter.com/intent/tweet?text=${e(text)}`},
    {id:"threads",name:"Threads",icon:"🧵",color:"#101010",u:`https://www.threads.net/intent/post?text=${e(text)}`},
    {id:"fb",name:"Facebook",icon:"📘",color:"#1877f2",u:`https://www.facebook.com/sharer/sharer.php?u=${e(url)}&quote=${e(text)}`},
    {id:"reddit",name:"Reddit",icon:"🤖",color:"#ff4500",u:`https://www.reddit.com/submit?url=${e(url)}&title=${e(text)}`},
    {id:"linkedin",name:"LinkedIn",icon:"💼",color:"#0a66c2",u:`https://www.linkedin.com/sharing/share-offsite/?url=${e(url)}&title=${e(text)}`},
    {id:"weibo",name:"微博",icon:"W",color:"#e6162d",u:`https://service.weibo.com/share/share.php?url=${e(url)}&title=${e(text)}`},
    {id:"wa",name:"WhatsApp",icon:"💬",color:"#25d366",u:`https://wa.me/?text=${e(text+" "+url)}`},
    {id:"tg",name:"Telegram",icon:"✈️",color:"#2aabee",u:`https://t.me/share/url?url=${e(url)}&text=${e(text)}`},
    {id:"line",name:"LINE",icon:"L",color:"#06c755",u:`https://social-plugins.line.me/lineit/share?url=${e(url)}&text=${e(text)}`},
    {id:"email",name:"邮件",icon:"✉️",color:"#555",u:`mailto:?subject=${e("Is Trump Available?")}&body=${e(text+"\n\n"+url)}`},
    {id:"copy",name:"复制文本",icon:"📋",color:"#f4b400",action:"copy"},
    {id:"native",name:"系统分享",icon:"📤",color:"#d7263d",action:"native",only:!!navigator.share}
  ];
}
function openSharePanel(text,url,title,onClose){
  text=tr(text); // what leaves the page (tweet text, clipboard) is built outside the DOM, so translate it here
  const platforms=sharePlatforms(text,url);
  const gridHtml=platforms.filter(p=>p.only!==false).map(p=>
    `<button class="share-btn" data-id="${p.id}" data-u="${p.u||''}" data-act="${p.action||'url'}" style="background:${p.color};">
      <div class="si">${p.icon}</div><div class="sn">${p.name}</div>
    </button>`).join("");
  showModal({
    title:title||"📤 分享",
    body:`<p style="font-size:11px;background:#fff;padding:8px;border:2px dashed var(--ink);border-radius:6px;margin-bottom:10px;white-space:pre-wrap;line-height:1.4;">${text}</p><div class="share-grid">${gridHtml}</div>`,
    choices:[{label:"关闭",fn:onClose||closeModal}]
  });
  setTimeout(()=>{
    document.querySelectorAll('.share-btn').forEach(b=>{
      b.onclick=()=>{
        const a=b.dataset.act;
        if(a==="copy"){
          copyText(text);
        }else if(a==="native"){
          if(navigator.share)navigator.share({title:"Is Trump Available?",text,url}).catch(()=>{});
        }else{
          window.open(b.dataset.u,"_blank","noopener");
        }
      };
    });
  },10);
}

function shareResult(){
  const text=`Is Trump Available? — ${state.end.stars}星结局 (${state.diff})\n${30-state.day}/30 天，好感度 ${state.trumpWillingness}，准备度 ${state.readiness}\n by @MatthewUpbeat #IsTrumpAvailable #虚构政治讽刺`;
  openSharePanel(text,GAME_URL,"📤 分享你的外交成绩");
}
function gameShareText(){
  return arcLive()?"我正在 30 秒抓 Trump，好感 "+arc.score+"/"+ARC_GOAL+"！你也来试试？\n by @MatthewUpbeat #IsTrumpAvailable #虚构政治讽刺":
    "🎮 Is Trump Available? — 30 秒抓 Trump：点中真 Trump，别点到模仿秀演员。\n还有 30 天外交策略模式。虚构政治讽刺。\n by @MatthewUpbeat #IsTrumpAvailable #虚构政治讽刺";
}
function shareGame(){
  const live=arcLive(); // a round in progress pauses while the panel is open
  openSharePanel(gameShareText(),GAME_URL,live?"📣 分享（游戏已暂停）":"📣 把游戏分享给朋友",live?arcPause():undefined);
}
// the row of follow + one-tap share buttons on the menu and both play screens
const SOCIAL_IDS=["x","fb","weibo","wa","tg","copy"];
function socialClick(id){
  if(id==="more") return shareGame();
  const text=tr(gameShareText()), p=sharePlatforms(text,GAME_URL).find(p=>p.id===id);
  if(p.action==="copy") return copyText(text);
  const resume=arcLive()&&arcPause();
  window.open(p.u,"_blank","noopener");
  if(resume) showModal({title:"⏸ 已暂停",body:"分享完回来继续抓 Trump。",choices:[{label:"▶️ 继续",fn:resume}]});
}
function paintSocial(){
  const ps=sharePlatforms("","");
  document.querySelectorAll(".social").forEach(box=>{
    box.innerHTML='<a href="'+AUTHOR_URL+'" target="_blank" rel="noopener" class="author-link">🐦 @MatthewUpbeat</a>'+
      SOCIAL_IDS.map(id=>{const p=ps.find(p=>p.id===id);
        return '<button class="soc" data-id="'+id+'" title="分享到 '+p.name+'" aria-label="分享到 '+p.name+'" style="background:'+p.color+'">'+p.icon+'</button>';}).join("")+
      '<button class="soc" data-id="more" title="更多分享方式" aria-label="更多分享方式" style="background:var(--panel);color:var(--ink)">⋯</button>';
    box.onclick=e=>{const b=e.target.closest(".soc"); if(b) socialClick(b.dataset.id);};
  });
}

/* ---------- BOOT ---------- */
function showScreen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));}
function copyText(text){ // clipboard is missing on http pages and can be refused: fall back to showing the text
  const fail=()=>alert(text);
  try{navigator.clipboard.writeText(text).then(()=>toast("📋 已复制","文本到剪贴板"),fail);}catch(e){fail();}
}
function startNewGame(diff){
  showScreen("game");
  newGame(diff);
}
function paintArcBest(diff){
  const b=arcBest(diff);
  document.getElementById("arc-best").textContent=b?"🏆 最高 "+b+" 好感":"30 秒过 100 握手，越多越好";
}
function hasSave(){try{return !!localStorage.getItem("ita_save");}catch(e){return false;}}
function showMenu(){
  arcStop();
  document.getElementById("btn-continue").disabled=!hasSave(); // nothing to continue until a strategy game was saved
  paintArcBest(document.querySelector("#menu .diff .on").dataset.diff);
  showScreen("menu");
}
function showAchievements(){
  const unlocked=loadAchievementsGlobal();
  showModal({
    title:"🏆 全部成就 ("+unlocked.size+"/"+ACHIEVEMENTS.length+")",
    body:ACHIEVEMENTS.map(a=>{
      const got=unlocked.has(a.id);
      return `<div style="padding:6px;margin:3px 0;border:2px solid #1a1a1a;border-radius:6px;background:${got?'#f4b400':'#eee'};opacity:${got?1:.5}"><b>${a.icon} ${a.name}</b><br><small>${a.desc}</small></div>`;
    }).join(""),
    choices:[{label:"关闭",fn:closeModal}]
  });
}
function showHelp(){
  showModal({
    title:"❓ 玩法说明",
    body:`
      <p><b>🎮 抓 Trump（默认）</b></p>
      <p>Trump 在 9 个地点之间乱窜，<b>点中他</b>涨好感，30 秒内过 100 就握手成功，之后继续冲高分。✨ 金光 Trump +20，连中 5 次进入握手狂热。</p>
      <p>⚠️ 混进来的<b>模仿秀演员</b>（发色或领带不对）别点，点了扣 10。好感过半后真假会<b>同时出现</b>。</p>
      <p>🔥 连中 3 次起每次多加分；好感越高他跑得越快；用时越短评级越高。</p>
      <p>⌨️ 电脑上可以用 QWE / ASD / ZXC 或小键盘对应九个格子。</p>
      <p><b>🧠 策略模式</b></p>
      <p>30 天内把准备度刷到 80、好感刷到 60，去「最终会面」握手。跟着发光的 <b>推荐</b> 按钮走就行。</p>
      <p style="font-size:10px;color:#888;">虚构政治讽刺，角色和事件均为虚构。</p>
    `,
    choices:[{label:"知道了",fn:closeModal}]
  });
}

document.addEventListener("DOMContentLoaded",()=>{
  let chosenDiff="normal";
  paintArcBest(chosenDiff);
  document.querySelectorAll(".diff button").forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll(".diff button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      chosenDiff=b.dataset.diff;
      paintArcBest(chosenDiff);
    };
  });
  const adv=document.getElementById("adv-toggle");
  adv.checked=advancedOn();
  adv.onchange=()=>{try{localStorage.setItem("ita_advanced",adv.checked?"1":"0");}catch(e){}};
  document.getElementById("btn-continue").disabled=!hasSave();
  document.getElementById("btn-new").onclick=()=>arcIntro(chosenDiff);
  document.getElementById("btn-strategy").onclick=()=>startNewGame(chosenDiff);
  document.getElementById("btn-continue").onclick=()=>{
    if(loadGame()){
      showScreen("game");
      renderAll();
    }else{
      toast("📭 没有存档","请先开始一局新游戏");
    }
  };
  document.getElementById("btn-daily").onclick=()=>{
    // seed by today's date
    const d=new Date();
    const seed=d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate();
    showScreen("game");
    newGame(chosenDiff);
    state.seed=seed; state.rng=mulberry32(seed); state.chaos.rng=state.rng;
    log("","🎲 每日挑战 seed="+seed);
  };
  document.getElementById("btn-ach").onclick=showAchievements;
  document.getElementById("btn-share").onclick=shareGame;
  paintSocial();
  const sel=document.getElementById("lang");
  sel.innerHTML=Object.keys(LANGS).map(k=>'<option value="'+k+'"'+(k===LANG?" selected":"")+'>🌐 '+LANGS[k]+'</option>').join("");
  sel.onchange=()=>{try{localStorage.setItem("ita_lang",sel.value);}catch(e){} location.reload();}; // reload: the page is rebuilt from the Chinese source
  document.getElementById("btn-help").onclick=showHelp;
});
</script>
